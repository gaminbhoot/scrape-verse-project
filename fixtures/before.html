<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Layoffs Live Data - Snapshot Before Redesign</title>
  </head>
  <body>
    <div id="app-root">
      <header class="site-header">
        <h1>Tech Layoffs Tracker (Live Data)</h1>
      </header>
      <main class="data-container">
        <table class="layoffs-table">
          <thead>
            <tr>
              <th>Company</th>
              <th>Headcount Impacted</th>
              <th>Division</th>
              <th>Date Reported</th>
            </tr>
          </thead>
          <tbody>
            <tr class="row-entry">
              <td class="company-name-v1">CloudCore Inc.</td>
              <td><span class="impact-number">240</span></td>
              <td class="division-impacted">Engineering</td>
              <td><time class="notice-date" datetime="2026-08-16">2026-08-16</time></td>
            </tr>
            <tr class="row-entry">
              <td class="company-name-v1">DataPulse Labs</td>
              <td><span class="impact-number">115</span></td>
              <td class="division-impacted">Marketing & Sales</td>
              <td><time class="notice-date" datetime="2026-08-15">2026-08-15</time></td>
            </tr>
            <tr class="row-entry">
              <td class="company-name-v1">NeuralGrid AI</td>
              <td><span class="impact-number">85</span></td>
              <td class="division-impacted">Operations</td>
              <td><time class="notice-date" datetime="2026-08-14">2026-08-14</time></td>
            </tr>
          </tbody>
        </table>
      </main>
    </div>
  </body>
</html>
